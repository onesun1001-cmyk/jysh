<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>미리보기 A · 지문 스캔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b1220;--mint:#3ddbb8;--gold:#e8c98a;--mono:'JetBrains Mono',ui-monospace,monospace;--serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 80% at 50% 28%,#172340,#0b1220 70%);color:#cfd8e8;font-family:var(--sans);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .tag{position:fixed;top:16px;left:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:#5d6b85}
  .cap{margin-top:26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--mint);transition:color .6s;text-align:center;min-height:16px}
  .sub{margin-top:9px;font-size:13.5px;color:#8a97b2;text-align:center;min-height:20px;transition:opacity .4s}
  .done .cap{color:var(--gold)}
  .names{font-family:var(--serif);font-size:20px;color:#fff;letter-spacing:.06em;margin-top:14px;opacity:0;transform:translateY(8px);transition:opacity .8s .3s,transform .8s .3s}
  .names b{color:var(--gold);font-weight:400;margin:0 8px}
  .done .names{opacity:1;transform:none}
  .bar{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .5s .8s}
  .done .bar{opacity:1;pointer-events:auto}
  .bar a,.bar button{font-family:var(--sans);font-size:12.5px;color:#cfd8e8;background:rgba(255,255,255,.06);border:1px solid #2c3b5e;border-radius:999px;padding:9px 14px;text-decoration:none;cursor:pointer}

  #fp{width:260px;height:300px;display:block;cursor:pointer}
  .ring{position:absolute;width:250px;height:250px;border-radius:50%;border:1px solid rgba(61,219,184,.35);animation:rip 2.4s ease-out infinite;pointer-events:none}
  .ring.b{animation-delay:1.2s}
  @keyframes rip{0%{transform:scale(.72);opacity:.7}100%{transform:scale(1.25);opacity:0}}
  .holding .ring,.done .ring{display:none}
  .fpbox{position:relative;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="tag">PREVIEW A · BIOMETRIC</div>
<div class="stage" id="stage">
  <div class="fpbox"><div class="ring"></div><div class="ring b"></div><canvas id="fp" aria-label="지문을 길게 눌러 인증"></canvas></div>
  <div class="cap" id="cap">BIOMETRIC AUTH REQUIRED</div>
  <div class="sub" id="sub">지문을 길게 눌러 인증하세요</div>
  <div class="names">박상현<b>♥</b>윤지윤</div>
  <div class="bar"><button id="again">↻ 다시 보기</button><a href="keypair.html">B안 보기 →</a><a href="../">현재 버전</a></div>
</div>
<script>
const cv=document.getElementById('fp'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
const Wc=260,Hc=300,dpr=Math.min(2.5,devicePixelRatio||1); cv.width=Wc*dpr; cv.height=Hc*dpr; ctx.scale(dpr,dpr);
const N=9, cx=130, cy=168, HOLD=1500, MORPH=1100;
const DELTA=[1.25,0.25,0.95,0.5,1.05,0.35,0.85,0.55,0.72];
const GAPS={2:[0.30,0.37],4:[0.70,0.76],5:[0.62,0.70],7:[0.14,0.20],8:[0.44,0.49]};
const ridges=[];
for(let i=0;i<N;i++){
  const g=GAPS[i], segs=g?[[0,g[0]],[g[1],1]]:[[0,1]], mid=g?(g[0]+g[1])/2:null;
  const tgt=g?[[0,mid],[mid,1]]:[[0,1]];
  ridges.push({i,rx:12+i*12.5,ry:(12+i*12.5)*1.2,d:DELTA[i],segs,tgt,s:(i+1)/N*6.3});
}
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fpPoint(r,t){ const ph=(Math.PI+r.d)-t*(Math.PI+2*r.d); return [cx+r.rx*Math.cos(ph), cy-r.ry*Math.sin(ph)]; }
function heartPoint(r,t){ const u=Math.PI+2*Math.PI*t;
  const x=16*Math.pow(Math.sin(u),3), y=-(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u));
  return [cx+r.s*x, 142+r.s*y]; }
let hold=0, morph=0, holding=false, done=false, tDone=0, last=performance.now();
function strokeAll(m,alpha,color,width,blur){
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=width; ctx.strokeStyle=color; ctx.globalAlpha=alpha; ctx.shadowColor=color; ctx.shadowBlur=blur;
  const e=ease(m);
  for(const r of ridges) r.segs.forEach((sg,k)=>{
    const tg=r.tgt[k], n=64; ctx.beginPath();
    for(let j=0;j<=n;j++){ const q=j/n, a=fpPoint(r,lerp(sg[0],sg[1],q)), b=heartPoint(r,lerp(tg[0],tg[1],q));
      const x=lerp(a[0],b[0],e), y=lerp(a[1],b[1],e); j?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}
function mix(m){ const c=[[61,219,184],[232,201,138]]; return `rgb(${c[0].map((v,i)=>Math.round(lerp(v,c[1][i],m))).join(',')})`; }
function frame(now){
  const dt=now-last; last=now;
  if(!done){ hold=Math.max(0,Math.min(1,hold+(holding?dt/HOLD:-dt/500)));
    if(hold>=1){ done=true; tDone=now; holding=false; stage.classList.remove('holding'); if(navigator.vibrate) try{navigator.vibrate([20,40,30]);}catch(_){}
      document.getElementById('cap').textContent='IDENTITY VERIFIED'; document.getElementById('sub').textContent='소중한 분, 환영합니다'; } }
  else morph=Math.min(1,(now-tDone)/MORPH);
  ctx.clearRect(0,0,Wc,Hc);
  ctx.save();
  if(done&&morph>=1){ const b=1+Math.sin((now-tDone-MORPH)/420)*0.022; ctx.translate(cx,150); ctx.scale(b,b); ctx.translate(-cx,-150); }
  const col=mix(ease(morph));
  if(done){ strokeAll(morph,1,col,3.1,10+8*morph); }
  else{
    const idle=0.32+Math.sin(now/600)*0.06;
    strokeAll(0,idle,'#3ddbb8',3.1,0);                                  // dim ridges
    if(hold>0){ const y=Hc-hold*Hc; ctx.save(); ctx.beginPath(); ctx.rect(0,y,Wc,Hc-y); ctx.clip(); strokeAll(0,1,'#3ddbb8',3.1,12); ctx.restore();
      const g=ctx.createLinearGradient(0,y-26,0,y+3); g.addColorStop(0,'rgba(61,219,184,0)'); g.addColorStop(1,'rgba(61,219,184,.55)');
      ctx.fillStyle=g; ctx.fillRect(18,y-26,Wc-36,28); ctx.fillStyle='#d6fff4'; ctx.fillRect(18,y,Wc-36,1.6); }
  }
  ctx.restore();
  if(done&&morph>=.5) stage.classList.add('done');
  if(!done) document.getElementById('cap').textContent=holding?`SCANNING… ${String(Math.round(hold*100)).padStart(2,'0')}%`:'BIOMETRIC AUTH REQUIRED';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const down=e=>{ if(done||e.target.closest('.bar')) return; holding=true; stage.classList.add('holding'); };
const up=()=>{ holding=false; stage.classList.remove('holding'); };
addEventListener('pointerdown',down); addEventListener('pointerup',up); addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('again').onclick=()=>{ hold=0; morph=0; done=false; stage.classList.remove('done');
  document.getElementById('sub').textContent='지문을 길게 눌러 인증하세요'; };
</script>
</body>
</html>
